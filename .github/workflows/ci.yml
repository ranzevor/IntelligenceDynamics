name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install editable project
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Install and require native dependencies
        if: matrix.python == '3.12'
        run: python -m pip install -r requirements-native.txt
      - name: Require native imports
        if: matrix.python == '3.12'
        run: python -c "import jax, jaxlib, numpy, optax, scipy"
      - name: Check source
        run: python -B -m intelligence_dynamics check-source --workspace .
      - name: Check maintenance configuration
        run: python -B tools/check_maintenance.py
      - name: Test normal execution
        run: python -B -m unittest discover -s tests -v
      - name: Test optimized execution
        run: python -B -O -m unittest discover -s tests -v
      - name: Test execution without docstrings
        run: python -B -OO -m unittest discover -s tests -v
      - name: Lint
        run: ruff check --no-cache .
      - name: Formatting
        run: ruff format --check --no-cache .

  package:
    name: Wheel and consumer installation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements-build.lock
      - name: Build source and wheel assets
        run: python -B tools/build_release.py "${{ runner.temp }}/release"
      - name: Install, exercise, uninstall and reinstall the wheel
        run: python -B tools/smoke_wheel.py "${{ runner.temp }}/release/artifacts" "${{ runner.temp }}/consumer"
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release/artifacts/*
          if-no-files-found: error
          retention-days: 14

  complete:
    name: CI
    if: always()
    needs: [test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: test "$TEST_RESULT" = success && test "$PACKAGE_RESULT" = success
